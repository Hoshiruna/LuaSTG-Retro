name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache C++ packages
        uses: actions/cache@v6
        with:
          path: build/packages
          key: windows-x86-cpm-${{ hashFiles('cmake/import/*.cmake', 'cmake/build/*.cmake', 'cmake/packages.lua.cmake') }}
          restore-keys: |
            windows-x86-cpm-

      - name: Enable VS2022 presets
        run: |
          '{"version":6,"include":["cmake/presets/vs2022.json"]}' | Set-Content CMakeUserPresets.json

      - name: CMake workflow
        run: cmake --workflow --preset windows-x86-release
